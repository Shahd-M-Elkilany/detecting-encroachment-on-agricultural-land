name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # the shipped model was pickled with scikit-learn 1.7.2
          pip install "scikit-learn==1.7.2" pytest httpx ruff
      - name: Syntax errors and undefined names
        run: ruff check . --select E9,F63,F7,F82 --exclude docs,reports,results
      - name: Tests (synthetic tiles, no dataset needed)
        run: pytest
